name: build-lumina
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - name: Create project files
        run: |
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'LUMINA_EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'lumina-client'
          LUMINA_EOF
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'LUMINA_EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.4
          loader_version=0.18.4
          loom_version=1.14-SNAPSHOT
          fabric_api_version=0.141.1+1.21.11

          mod_version=1.0.0
          maven_group=com.lumina
          archives_base_name=lumina-client
          LUMINA_EOF
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'LUMINA_EOF'
          plugins {
              id 'fabric-loom' version "${project.loom_version}"
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          LUMINA_EOF
          mkdir -p "$(dirname 'src/main/resources/fabric.mod.json')"
          cat > 'src/main/resources/fabric.mod.json' <<'LUMINA_EOF'
          {
            "schemaVersion": 1,
            "id": "lumina",
            "version": "${version}",
            "name": "Lumina Client",
            "description": "Lightweight client: HUD, custom menu, cosmetics, zoom, music, performance boost.",
            "authors": ["You"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["com.lumina.LuminaClient"]
            },
            "depends": {
              "fabricloader": ">=0.18.1",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          LUMINA_EOF
          mkdir -p "$(dirname 'src/main/resources/assets/lumina/lang/en_us.json')"
          cat > 'src/main/resources/assets/lumina/lang/en_us.json' <<'LUMINA_EOF'
          {
            "key.category.lumina.main": "Lumina Client",
            "key.lumina.settings": "Open Lumina Settings",
            "key.lumina.zoom": "Zoom (hold)",
            "key.lumina.music": "Music Play/Stop",
            "key.lumina.next": "Music Next Track"
          }
          LUMINA_EOF
          mkdir -p "$(dirname 'src/main/java/com/lumina/Cosmetics.java')"
          cat > 'src/main/java/com/lumina/Cosmetics.java' <<'LUMINA_EOF'
          package com.lumina;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.particle.ParticleTypes;

          /** Simple particle cosmetics (visible in third person). */
          public final class Cosmetics {
              private Cosmetics() {}

              public static void tick(MinecraftClient client, int t) {
                  int mode = LuminaConfig.INSTANCE.cosmetic;
                  ClientPlayerEntity p = client.player;
                  if (mode == 0 || p == null || client.world == null) return;
                  if (client.options.getPerspective().isFirstPerson()) return;

                  if (mode == 1) { // halo
                      for (int i = 0; i < 2; i++) {
                          double a = (t * 0.25) + i * Math.PI;
                          double x = p.getX() + Math.cos(a) * 0.45;
                          double z = p.getZ() + Math.sin(a) * 0.45;
                          double y = p.getY() + p.getHeight() + 0.25;
                          client.getParticleManager().addParticle(ParticleTypes.END_ROD, x, y, z, 0, 0, 0);
                      }
                  } else if (mode == 2 && t % 2 == 0) { // trail
                      client.getParticleManager().addParticle(
                          ParticleTypes.HAPPY_VILLAGER, p.getX(), p.getY() + 0.1, p.getZ(), 0, 0.02, 0);
                  }
              }

              public static String name(int mode) {
                  return switch (mode) {
                      case 1 -> "Halo";
                      case 2 -> "Trail";
                      default -> "Off";
                  };
              }
          }
          LUMINA_EOF
          mkdir -p "$(dirname 'src/main/java/com/lumina/HudRenderer.java')"
          cat > 'src/main/java/com/lumina/HudRenderer.java' <<'LUMINA_EOF'
          package com.lumina;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.render.RenderTickCounter;
          import org.lwjgl.glfw.GLFW;

          import java.time.LocalTime;
          import java.time.format.DateTimeFormatter;
          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.List;

          public final class HudRenderer {
              private static final ArrayDeque<Long> LEFT = new ArrayDeque<>();
              private static final ArrayDeque<Long> RIGHT = new ArrayDeque<>();
              private static boolean wasL, wasR;
              private static final DateTimeFormatter TIME = DateTimeFormatter.ofPattern("HH:mm");

              private HudRenderer() {}

              private static int cps(ArrayDeque<Long> q, long now) {
                  while (!q.isEmpty() && now - q.peekFirst() > 1000) q.pollFirst();
                  return q.size();
              }

              public static void render(DrawContext ctx, RenderTickCounter tc) {
                  MinecraftClient mc = MinecraftClient.getInstance();
                  LuminaConfig cfg = LuminaConfig.INSTANCE;
                  if (mc.player == null || mc.options.hudHidden) return;

                  long now = System.currentTimeMillis();
                  if (mc.currentScreen == null) {
                      long win = mc.getWindow().getHandle();
                      boolean l = GLFW.glfwGetMouseButton(win, GLFW.GLFW_MOUSE_BUTTON_LEFT) == GLFW.GLFW_PRESS;
                      boolean r = GLFW.glfwGetMouseButton(win, GLFW.GLFW_MOUSE_BUTTON_RIGHT) == GLFW.GLFW_PRESS;
                      if (l && !wasL) LEFT.addLast(now);
                      if (r && !wasR) RIGHT.addLast(now);
                      wasL = l;
                      wasR = r;
                  }

                  List<String> lines = new ArrayList<>();
                  if (cfg.showFps) lines.add("FPS: " + mc.getCurrentFps());
                  if (cfg.showCps) lines.add("CPS: " + cps(LEFT, now) + " | " + cps(RIGHT, now));
                  if (cfg.showCoords) {
                      lines.add(String.format("XYZ: %d %d %d",
                          (int) Math.floor(mc.player.getX()),
                          (int) Math.floor(mc.player.getY()),
                          (int) Math.floor(mc.player.getZ())));
                  }
                  if (cfg.showTime) lines.add("Time: " + LocalTime.now().format(TIME));
                  if (cfg.showMusic && MusicPlayer.isActive()) lines.add("Music: " + MusicPlayer.currentName());
                  if (lines.isEmpty()) return;

                  int lh = mc.textRenderer.fontHeight + 2;
                  int w = 0;
                  for (String s : lines) w = Math.max(w, mc.textRenderer.getWidth(s));
                  int x = cfg.hudX, y = cfg.hudY;
                  ctx.fill(x - 2, y - 2, x + w + 3, y + lines.size() * lh, 0x90000000);
                  for (int i = 0; i < lines.size(); i++) {
                      ctx.drawTextWithShadow(mc.textRenderer, lines.get(i), x, y + i * lh, 0xFFFFFFFF);
                  }
              }
          }
          LUMINA_EOF
          mkdir -p "$(dirname 'src/main/java/com/lumina/LuminaClient.java')"
          cat > 'src/main/java/com/lumina/LuminaClient.java' <<'LUMINA_EOF'
          package com.lumina;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientLifecycleEvents;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.hud.HudElementRegistry;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.screen.TitleScreen;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.util.Identifier;
          import org.lwjgl.glfw.GLFW;

          public class LuminaClient implements ClientModInitializer {
              private static KeyBinding settingsKey, zoomKey, musicKey, nextKey;
              private static boolean zooming = false;
              private static int savedFov = 70;
              private static int tickCount = 0;

              @Override
              public void onInitializeClient() {
                  KeyBinding.Category cat = KeyBinding.Category.create(Identifier.of("lumina", "main"));
                  settingsKey = KeyBindingHelper.registerKeyBinding(
                      new KeyBinding("key.lumina.settings", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_RIGHT_SHIFT, cat));
                  zoomKey = KeyBindingHelper.registerKeyBinding(
                      new KeyBinding("key.lumina.zoom", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_C, cat));
                  musicKey = KeyBindingHelper.registerKeyBinding(
                      new KeyBinding("key.lumina.music", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_M, cat));
                  nextKey = KeyBindingHelper.registerKeyBinding(
                      new KeyBinding("key.lumina.next", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_N, cat));

                  HudElementRegistry.addLast(Identifier.of("lumina", "hud"), HudRenderer::render);
                  ClientTickEvents.END_CLIENT_TICK.register(LuminaClient::onTick);
                  ClientLifecycleEvents.CLIENT_STOPPING.register(c -> {
                      stopZoom(c);
                      LuminaConfig.INSTANCE.save();
                  });
              }

              private static void onTick(MinecraftClient client) {
                  LuminaConfig cfg = LuminaConfig.INSTANCE;

                  if (cfg.customMenu && client.currentScreen instanceof TitleScreen) {
                      client.setScreen(new MenuScreen());
                  }
                  MusicPlayer.tick(client);

                  if (client.player == null || client.world == null) {
                      stopZoom(client);
                      return;
                  }

                  while (settingsKey.wasPressed()) client.setScreen(new SettingsScreen(null));
                  while (musicKey.wasPressed()) MusicPlayer.toggle();
                  while (nextKey.wasPressed()) MusicPlayer.next(true);

                  if (zoomKey.isPressed()) {
                      if (!zooming) {
                          savedFov = client.options.getFov().getValue();
                          zooming = true;
                      }
                      client.options.getFov().setValue(cfg.zoomFov);
                  } else {
                      stopZoom(client);
                  }

                  Cosmetics.tick(client, tickCount++);
              }

              private static void stopZoom(MinecraftClient client) {
                  if (zooming) {
                      client.options.getFov().setValue(savedFov);
                      zooming = false;
                  }
              }
          }
          LUMINA_EOF
          mkdir -p "$(dirname 'src/main/java/com/lumina/LuminaConfig.java')"
          cat > 'src/main/java/com/lumina/LuminaConfig.java' <<'LUMINA_EOF'
          package com.lumina;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;

          import java.nio.file.Files;
          import java.nio.file.Path;

          public class LuminaConfig {
              public boolean showFps = true;
              public boolean showCps = true;
              public boolean showCoords = true;
              public boolean showTime = true;
              public boolean showMusic = true;
              public boolean customMenu = true;
              public int cosmetic = 0;       // 0 off, 1 halo, 2 trail
              public int zoomFov = 30;       // vanilla FOV slider minimum is 30
              public int musicVolumePct = 100;
              public int musicIndex = 0;
              public int hudX = 4;
              public int hudY = 4;

              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              private static final Path FILE = FabricLoader.getInstance().getConfigDir().resolve("lumina.json");
              public static final LuminaConfig INSTANCE = load();

              private static LuminaConfig load() {
                  try {
                      if (Files.exists(FILE)) {
                          LuminaConfig c = GSON.fromJson(Files.readString(FILE), LuminaConfig.class);
                          if (c != null) return c;
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
                  return new LuminaConfig();
              }

              public void save() {
                  try {
                      Files.writeString(FILE, GSON.toJson(this));
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          LUMINA_EOF
          mkdir -p "$(dirname 'src/main/java/com/lumina/MenuScreen.java')"
          cat > 'src/main/java/com/lumina/MenuScreen.java' <<'LUMINA_EOF'
          package com.lumina;

          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.screen.multiplayer.MultiplayerScreen;
          import net.minecraft.client.gui.screen.option.OptionsScreen;
          import net.minecraft.client.gui.screen.world.SelectWorldScreen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.text.Text;
          import net.minecraft.util.Formatting;

          public class MenuScreen extends Screen {
              public MenuScreen() {
                  super(Text.literal("Lumina"));
              }

              @Override
              protected void init() {
                  int bw = 200, bh = 20, x = width / 2 - bw / 2;
                  int y = height / 2 - 30;
                  addDrawableChild(ButtonWidget.builder(Text.literal("Singleplayer"),
                      b -> client.setScreen(new SelectWorldScreen(this))).dimensions(x, y, bw, bh).build());
                  addDrawableChild(ButtonWidget.builder(Text.literal("Multiplayer"),
                      b -> client.setScreen(new MultiplayerScreen(this))).dimensions(x, y + 24, bw, bh).build());
                  addDrawableChild(ButtonWidget.builder(Text.literal("Lumina Settings"),
                      b -> client.setScreen(new SettingsScreen(this))).dimensions(x, y + 48, bw, bh).build());
                  addDrawableChild(ButtonWidget.builder(Text.literal("Options"),
                      b -> client.setScreen(new OptionsScreen(this, client.options))).dimensions(x, y + 72, bw / 2 - 2, bh).build());
                  addDrawableChild(ButtonWidget.builder(Text.literal("Quit"),
                      b -> client.scheduleStop()).dimensions(x + bw / 2 + 2, y + 72, bw / 2 - 2, bh).build());
              }

              @Override
              public void renderBackground(DrawContext context, int mouseX, int mouseY, float delta) {
                  context.fillGradient(0, 0, width, height, 0xFF0B1020, 0xFF1B1035);
              }

              @Override
              public void render(DrawContext context, int mouseX, int mouseY, float delta) {
                  super.render(context, mouseX, mouseY, delta);
                  context.drawCenteredTextWithShadow(textRenderer,
                      Text.literal("L U M I N A").formatted(Formatting.BOLD, Formatting.AQUA),
                      width / 2, height / 2 - 70, 0xFFFFFFFF);
                  context.drawCenteredTextWithShadow(textRenderer,
                      Text.literal("Client for 1.21.11").formatted(Formatting.GRAY),
                      width / 2, height / 2 - 55, 0xFFFFFFFF);
              }

              @Override
              public boolean shouldCloseOnEsc() {
                  return false;
              }
          }
          LUMINA_EOF
          mkdir -p "$(dirname 'src/main/java/com/lumina/MusicPlayer.java')"
          cat > 'src/main/java/com/lumina/MusicPlayer.java' <<'LUMINA_EOF'
          package com.lumina;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.sound.PositionedSoundInstance;
          import net.minecraft.client.sound.SoundInstance;
          import net.minecraft.sound.SoundEvent;
          import net.minecraft.util.Identifier;

          /** Plays vanilla music discs as a playlist (works in menus and in-game). */
          public final class MusicPlayer {
              public static final String[] IDS = {
                  "13", "cat", "blocks", "chirp", "far", "mall", "mellohi", "stal", "strad",
                  "ward", "wait", "otherside", "pigstep", "5", "relic", "creator", "precipice"
              };
              public static final String[] NAMES = {
                  "13", "Cat", "Blocks", "Chirp", "Far", "Mall", "Mellohi", "Stal", "Strad",
                  "Ward", "Wait", "Otherside", "Pigstep", "5", "Relic", "Creator", "Precipice"
              };

              private static SoundInstance current;
              private static boolean active = false;
              private static int grace = 0;

              private MusicPlayer() {}

              public static boolean isActive() { return active; }

              public static String currentName() {
                  int i = Math.floorMod(LuminaConfig.INSTANCE.musicIndex, IDS.length);
                  return NAMES[i];
              }

              public static void play() {
                  MinecraftClient client = MinecraftClient.getInstance();
                  stopSound(client);
                  int i = Math.floorMod(LuminaConfig.INSTANCE.musicIndex, IDS.length);
                  SoundEvent ev = SoundEvent.of(Identifier.ofVanilla("music_disc." + IDS[i]));
                  float vol = LuminaConfig.INSTANCE.musicVolumePct / 100f;
                  current = PositionedSoundInstance.master(ev, 1.0f, vol);
                  client.getSoundManager().play(current);
                  active = true;
                  grace = 60;
              }

              public static void stop() {
                  stopSound(MinecraftClient.getInstance());
                  active = false;
              }

              public static void toggle() {
                  if (active) stop(); else play();
              }

              public static void next(boolean restart) {
                  LuminaConfig.INSTANCE.musicIndex = Math.floorMod(LuminaConfig.INSTANCE.musicIndex + 1, IDS.length);
                  LuminaConfig.INSTANCE.save();
                  if (restart || active) play();
              }

              public static void prev() {
                  LuminaConfig.INSTANCE.musicIndex = Math.floorMod(LuminaConfig.INSTANCE.musicIndex - 1, IDS.length);
                  LuminaConfig.INSTANCE.save();
                  if (active) play();
              }

              private static void stopSound(MinecraftClient client) {
                  if (current != null) {
                      client.getSoundManager().stop(current);
                      current = null;
                  }
              }

              /** Auto-advance when a track ends. */
              public static void tick(MinecraftClient client) {
                  if (!active || current == null) return;
                  if (grace > 0) { grace--; return; }
                  if (!client.getSoundManager().isPlaying(current)) {
                      next(true);
                  }
              }
          }
          LUMINA_EOF
          mkdir -p "$(dirname 'src/main/java/com/lumina/PerformanceBoost.java')"
          cat > 'src/main/java/com/lumina/PerformanceBoost.java' <<'LUMINA_EOF'
          package com.lumina;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.GameOptions;
          import net.minecraft.client.option.ParticlesMode;
          import net.minecraft.text.Text;

          public final class PerformanceBoost {
              private PerformanceBoost() {}

              public static void apply(MinecraftClient client) {
                  GameOptions o = client.options;
                  o.getViewDistance().setValue(Math.min(o.getViewDistance().getValue(), 8));
                  o.getSimulationDistance().setValue(Math.min(o.getSimulationDistance().getValue(), 6));
                  o.getParticles().setValue(ParticlesMode.DECREASED);
                  o.getEntityShadows().setValue(false);
                  o.getBiomeBlendRadius().setValue(0);
                  o.getEntityDistanceScaling().setValue(0.75);
                  o.write();
                  if (client.player != null) {
                      client.player.sendMessage(Text.literal("[Lumina] Performance boost applied"), true);
                  }
              }
          }
          LUMINA_EOF
          mkdir -p "$(dirname 'src/main/java/com/lumina/SettingsScreen.java')"
          cat > 'src/main/java/com/lumina/SettingsScreen.java' <<'LUMINA_EOF'
          package com.lumina;

          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.text.Text;

          import java.util.function.Supplier;

          public class SettingsScreen extends Screen {
              private final Screen parent;
              private int slot = 0;

              public SettingsScreen(Screen parent) {
                  super(Text.literal("Lumina Settings"));
                  this.parent = parent;
              }

              private static String onOff(boolean b) { return b ? "ON" : "OFF"; }

              private void add(Supplier<String> label, Runnable action) {
                  int col = slot % 2, row = slot / 2;
                  int x = width / 2 - 155 + col * 160;
                  int y = 24 + row * 22;
                  slot++;
                  addDrawableChild(ButtonWidget.builder(Text.literal(label.get()), b -> {
                      action.run();
                      LuminaConfig.INSTANCE.save();
                      b.setMessage(Text.literal(label.get()));
                  }).dimensions(x, y, 150, 20).build());
              }

              @Override
              protected void init() {
                  slot = 0;
                  LuminaConfig c = LuminaConfig.INSTANCE;
                  add(() -> "FPS: " + onOff(c.showFps), () -> c.showFps = !c.showFps);
                  add(() -> "CPS: " + onOff(c.showCps), () -> c.showCps = !c.showCps);
                  add(() -> "Coords: " + onOff(c.showCoords), () -> c.showCoords = !c.showCoords);
                  add(() -> "Time: " + onOff(c.showTime), () -> c.showTime = !c.showTime);
                  add(() -> "Music HUD: " + onOff(c.showMusic), () -> c.showMusic = !c.showMusic);
                  add(() -> "Custom Menu: " + onOff(c.customMenu), () -> c.customMenu = !c.customMenu);
                  add(() -> "Cosmetic: " + Cosmetics.name(c.cosmetic), () -> c.cosmetic = (c.cosmetic + 1) % 3);
                  add(() -> "Zoom FOV: " + c.zoomFov, () -> c.zoomFov = c.zoomFov >= 50 ? 30 : c.zoomFov + 10);
                  add(() -> "Prev: " + MusicPlayer.currentName(), MusicPlayer::prev);
                  add(() -> MusicPlayer.isActive() ? "Stop Music" : "Play Music", MusicPlayer::toggle);
                  add(() -> "Next Track", () -> MusicPlayer.next(false));
                  add(() -> "Music Vol: " + c.musicVolumePct + "%", () -> {
                      c.musicVolumePct = c.musicVolumePct <= 25 ? 100 : c.musicVolumePct - 25;
                  });
                  add(() -> "Performance Boost", () -> PerformanceBoost.apply(client));

                  int doneY = 24 + ((slot + 1) / 2) * 22 + 4;
                  addDrawableChild(ButtonWidget.builder(Text.literal("Done"), b -> close())
                      .dimensions(width / 2 - 75, doneY, 150, 20).build());
              }

              @Override
              public void render(DrawContext context, int mouseX, int mouseY, float delta) {
                  super.render(context, mouseX, mouseY, delta);
                  context.drawCenteredTextWithShadow(textRenderer, title, width / 2, 8, 0xFFFFFFFF);
              }

              @Override
              public void close() {
                  LuminaConfig.INSTANCE.save();
                  client.setScreen(parent);
              }
          }
          LUMINA_EOF
      - name: Build
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lumina-client
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
